name: Publish HyperScan diagnostic preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release-inputs-diagnostic-r3
          persist-credentials: false
      - name: Verify diagnostic release inputs
        run: |
          cat apk.part-* > HyperScan-10.13.0.455-diagnostic-r3.apk
          sha256sum --check RELEASE-SHA256SUMS.txt
      - name: Publish diagnostic preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=diagnostic-10.13.0.455-r3
          gh release upload "$tag" HyperScan-10.13.0.455-diagnostic-r3.apk HyperScan-Source.zip HyperScan-10.13.0.455-diagnostic-r3.apk.validation.json RELEASE-SHA256SUMS.txt
          gh release download community-preview-10.13.0.455 --pattern RELEASE-SHA256SUMS.txt --dir previous
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          source=Path('HyperScan-Source.zip')
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          manifest=Path('previous/RELEASE-SHA256SUMS.txt')
          rows=manifest.read_text().splitlines()
          rows=[f'{digest}  HyperScan-Source.zip' if line.endswith('  HyperScan-Source.zip') else line for line in rows]
          manifest.write_text('\n'.join(rows)+'\n')
          PYTHON
          gh release upload community-preview-10.13.0.455 HyperScan-Source.zip previous/RELEASE-SHA256SUMS.txt --clobber
