name: Publish HyperScan automatic scanner 0.5.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release-inputs-auto-scan-0.5.0
          persist-credentials: false
      - name: Verify release inputs
        run: sha256sum --check RELEASE-SHA256SUMS.txt
      - name: Publish automatic scanner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload auto-scan-0.5.0 HyperScan-0.5.0-auto-scan.apk HyperScan-Source.zip HyperScan-0.5.0-auto-scan.apk.validation.json RELEASE-SHA256SUMS.txt
