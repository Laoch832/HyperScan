name: Publish HyperScan core migration preview 0.3.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release-inputs-core-preview-0.3.0
          persist-credentials: false
      - name: Verify release inputs
        run: sha256sum --check RELEASE-SHA256SUMS.txt
      - name: Publish original core migration preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload core-preview-0.3.0 HyperScan-0.3.0-core-preview.apk HyperScan-Source.zip HyperScan-0.3.0-core-preview.apk.validation.json RELEASE-SHA256SUMS.txt
