name: Publish HyperScan live camera preview 0.4.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release-inputs-camera-preview-0.4.0
          persist-credentials: false
      - name: Verify release inputs
        run: sha256sum --check RELEASE-SHA256SUMS.txt
      - name: Publish live camera preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload camera-preview-0.4.0 HyperScan-0.4.0-camera-preview.apk HyperScan-Source.zip HyperScan-0.4.0-camera-preview.apk.validation.json RELEASE-SHA256SUMS.txt
